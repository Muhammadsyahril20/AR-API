<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard AR</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }
        .gradient-header {
            background: linear-gradient(135deg, #4e54c8 0%, #8f94fb 100%);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .card-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .btn-circle {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #4e54c8;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-cube me-2"></i>AR Unity Manager
            </a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row">
            
            <div class="col-lg-4 mb-4">
                <div class="card card-custom sticky-top" style="top: 20px; z-index: 100;">
                    <div class="gradient-header text-center">
                        <h5 class="mb-0 fw-bold" id="formTitle"><i class="fas fa-plus-circle me-2"></i>Tambah Data</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="formInput">
                            <input type="hidden" id="editId">

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">JUDUL KONTEN</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="fas fa-heading text-primary"></i></span>
                                    <input type="text" id="judul" class="form-control bg-light border-0" placeholder="Ex: Mesin V8" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">DESKRIPSI / INFORMASI</label>
                                <textarea id="informasi" class="form-control bg-light border-0" rows="6" placeholder="Tulis penjelasan detail disini..." required></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" id="btnSimpan" class="btn btn-primary fw-bold py-2 rounded-pill">
                                    <i class="fas fa-save me-1"></i> SIMPAN DATA
                                </button>
                                <button type="button" id="btnBatal" class="btn btn-outline-secondary fw-bold py-2 rounded-pill d-none" onclick="batalEdit()">
                                    <i class="fas fa-times me-1"></i> BATAL
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <h5 class="fw-bold mb-3 text-secondary"><i class="fas fa-list me-2"></i>Daftar Konten AR</h5>
                
                <div id="loading" class="text-center py-5 d-none">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Memuat data...</p>
                </div>

                <div id="listData" class="row g-3">
                    </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = '/api/data';
        let allData = [];

        // 1. Fungsi Simpan / Update
        document.getElementById('formInput').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('editId').value;
            const judul = document.getElementById('judul').value;
            const informasi = document.getElementById('informasi').value;
            
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;
            const actionText = id ? 'diupdate' : 'disimpan';

            try {
                // Tampilkan loading di tombol
                const btn = document.getElementById('btnSimpan');
                const oriText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
                btn.disabled = true;

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ judul, informasi })
                });

                const result = await response.json();
                
                // Balikin tombol
                btn.innerHTML = oriText;
                btn.disabled = false;

                if (result.status) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: `Data berhasil ${actionText}.`,
                        timer: 1500,
                        showConfirmButton: false
                    });
                    batalEdit();
                    loadData();
                } else {
                    Swal.fire('Gagal!', result.message, 'error');
                }
            } catch (error) {
                Swal.fire('Error!', 'Gagal koneksi ke server.', 'error');
            }
        });

        // 2. Fungsi Load Data
        async function loadData() {
            const list = document.getElementById('listData');
            const loading = document.getElementById('loading');
            
            list.innerHTML = '';
            loading.classList.remove('d-none'); // Munculkan loading

            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                
                loading.classList.add('d-none'); // Sembunyikan loading

                if(json.status && json.data.length > 0) {
                    allData = json.data;
                    
                    json.data.forEach(item => {
                        list.innerHTML += `
                            <div class="col-md-6">
                                <div class="card card-custom card-item h-100 bg-white">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <span class="badge bg-light text-primary border">ID: ${item.id}</span>
                                            <div>
                                                <button class="btn btn-circle btn-outline-warning btn-sm me-1" onclick="mulaiEdit(${item.id})" title="Edit">
                                                    <i class="fas fa-pen"></i>
                                                </button>
                                                <button class="btn btn-circle btn-outline-danger btn-sm" onclick="hapusData(${item.id})" title="Hapus">
                                                    <i class="fas fa-trash-alt"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <h5 class="card-title fw-bold text-dark">${item.judul}</h5>
                                        <p class="card-text text-muted small" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                                            ${item.informasi}
                                        </p>
                                    </div>
                                </div>
                            </div>`;
                    });
                } else {
                    list.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <img src="https://cdn-icons-png.flaticon.com/512/7486/7486777.png" width="100" class="mb-3 opacity-50">
                            <h6 class="text-muted">Belum ada data tersimpan</h6>
                        </div>`;
                }
            } catch (err) {
                loading.classList.add('d-none');
                list.innerHTML = `<div class="alert alert-danger w-100">Gagal mengambil data dari server.</div>`;
            }
        }

        // 3. Fungsi Mulai Edit
        function mulaiEdit(id) {
            const data = allData.find(d => d.id === id);
            if(data) {
                document.getElementById('editId').value = data.id;
                document.getElementById('judul').value = data.judul;
                document.getElementById('informasi').value = data.informasi;

                // Update UI
                document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit me-2"></i>Edit Data';
                const btnSimpan = document.getElementById('btnSimpan');
                btnSimpan.innerHTML = '<i class="fas fa-check-circle me-1"></i> UPDATE DATA';
                btnSimpan.classList.remove('btn-primary');
                btnSimpan.classList.add('btn-warning', 'text-white');
                
                document.getElementById('btnBatal').classList.remove('d-none');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // 4. Fungsi Hapus Data (DELETE)
        function hapusData(id) {
            Swal.fire({
                title: 'Yakin hapus data?',
                text: "Data ID " + id + " akan hilang permanen!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Ya, Hapus!',
                cancelButtonText: 'Batal'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch(`${API_URL}/${id}`, {
                            method: 'DELETE'
                        });
                        const res = await response.json();

                        if (res.status) {
                            Swal.fire('Terhapus!', 'Data berhasil dihapus.', 'success');
                            loadData(); // Refresh
                            // Jika sedang edit data yang dihapus, batalkan edit
                            if(document.getElementById('editId').value == id) batalEdit();
                        } else {
                            Swal.fire('Gagal!', res.message, 'error');
                        }
                    } catch (err) {
                        Swal.fire('Error!', 'Gagal konek server.', 'error');
                    }
                }
            });
        }

        // 5. Fungsi Batal Edit
        function batalEdit() {
            document.getElementById('formInput').reset();
            document.getElementById('editId').value = "";

            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle me-2"></i>Tambah Data';
            const btnSimpan = document.getElementById('btnSimpan');
            btnSimpan.innerHTML = '<i class="fas fa-save me-1"></i> SIMPAN DATA';
            btnSimpan.classList.add('btn-primary');
            btnSimpan.classList.remove('btn-warning', 'text-white');

            document.getElementById('btnBatal').classList.add('d-none');
        }

        loadData();
    </script>

</body>
</html>
