<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .card-login { width: 100%; max-width: 400px; border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .card-header { background: #4f46e5; color: white; text-align: center; padding: 25px; border-radius: 15px 15px 0 0 !important; }
        .btn-login { background: #4f46e5; color: white; padding: 12px; font-weight: bold; width: 100%; border: none; border-radius: 8px; transition: 0.3s; }
        .btn-login:hover { background: #4338ca; }
        .form-control { padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="card card-login">
        <div class="card-header">
            <h4 class="mb-0"><i class="fas fa-user-shield me-2"></i>Admin Login</h4>
        </div>
        <div class="card-body p-4">
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Masukan username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Masukan password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-login">MASUK DASHBOARD</button>
            </form>
        </div>
    </div>

    <script>
        // Cek jika sudah login, langsung lempar ke admin
        if(localStorage.getItem('admin_token')) {
            window.location.href = 'admin.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData); // Ubah ke JSON object

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.status) {
                    // Simpan "Kunci Rahasia" di browser
                    localStorage.setItem('admin_token', 'rahasia-negara'); 
                    Swal.fire({ icon: 'success', title: 'Login Berhasil', showConfirmButton: false, timer: 1000 })
                    .then(() => { window.location.href = 'admin.html'; });
                } else {
                    Swal.fire('Gagal', 'Username atau Password salah!', 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Gagal menghubungi server', 'error');
            }
        });
    </script>
</body>
</html>
